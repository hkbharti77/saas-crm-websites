      <!-- Stage 1 -->
      <rect x="0" y="0" width="200" height="42" rx="8" fill="#065f46" stroke="#10b981" stroke-width="1"/>
      <text x="18" y="26" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">✓ Account Intake</text>

      <!-- Stage 2 -->
      <rect x="215" y="0" width="200" height="42" rx="8" fill="#065f46" stroke="#10b981" stroke-width="1"/>
      <text x="233" y="26" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">✓ Security Review</text>

