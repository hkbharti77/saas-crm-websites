    <text x="88" y="65" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Parent Account · 14 Sub-Entities · APAC &amp; EMEA Regional Divisions</text>

