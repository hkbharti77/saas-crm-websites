      <rect x="645" y="0" width="205" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="663" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">ERP &amp; Ops Sync</text>
    </g>

    <!-- Governance Summary -->
    <g transform="translate(25, 198)">
      <rect x="0" y="0" width="850" height="64" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="20" y="28" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">ROLE &amp; GOVERNANCE MATRIX</text>
      <text x="20" y="48" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Sales Director (Full Access) · Account Manager (Pipeline &amp; Comms) · Ops Lead (ERP Webhook &amp; Billing)</text>
