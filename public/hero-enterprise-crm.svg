    <text x="25" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">CENTRALIZED CROSS-DEPARTMENT ACTIVITY STREAM</text>

    <!-- Stream Item 1 -->
    <rect x="25" y="48" width="850" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="45" cy="67" r="4" fill="#34d399"/>
    <text x="65" y="71" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Contract executed ($180,000 ARR) — Triggered ERP billing webhook</text>
    <text x="820" y="71" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">14:02:10</text>

    <!-- Stream Item 2 -->
    <rect x="25" y="94" width="850" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="45" cy="113" r="4" fill="#38bdf8"/>
    <text x="65" y="117" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Account SLA policy assigned to EMEA Support &amp; Customer Success pod</text>
    <text x="820" y="117" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">14:05:45</text>

    <!-- Stream Item 3 -->
    <rect x="25" y="140" width="850" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="45" cy="159" r="4" fill="#10b981"/>
    <text x="65" y="163" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Unified 360° customer timeline synchronized across 8 regional branches</text>
    <text x="820" y="163" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">14:10:00</text>
