<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="entBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081426"/>
      <stop offset="50%" stop-color="#0d1b32"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>
    <linearGradient id="entPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="entCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="entShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="entGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0d9488" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Window -->
  <rect x="20" y="20" width="960" height="710" rx="20" fill="url(#entBgGrad)" stroke="#1e293b" stroke-width="2" filter="url(#entShadow)"/>

  <!-- Window Header Bar -->
  <path d="M 20 40 Q 20 20 40 20 L 960 20 Q 980 20 980 40 L 980 75 L 20 75 Z" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="50" cy="48" r="6" fill="#ef4444"/>
  <circle cx="70" cy="48" r="6" fill="#f59e0b"/>
  <circle cx="90" cy="48" r="6" fill="#10b981"/>
  <text x="120" y="53" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Gyan VaniAi · Enterprise Multi-Tenant CRM Platform</text>
  
  <!-- Security RBAC Badge -->
  <rect x="760" y="38" width="195" height="26" rx="13" fill="#134e4a" stroke="#0d9488" stroke-width="1"/>
  <text x="857" y="55" fill="#5eead4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🛡️ RBAC: ENTERPRISE ADMIN</text>

  <!-- Top Real-time Enterprise Metrics -->
  <g transform="translate(50, 95)">
    <rect x="0" y="0" width="280" height="85" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="18" y="28" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">ENTERPRISE ARR PIPELINE</text>
    <text x="18" y="60" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">$2.4M <tspan fill="#34d399" font-size="12" font-weight="600">+24% YoY</tspan></text>

    <rect x="310" y="0" width="280" height="85" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="328" y="28" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">CONNECTED WORKSPACES</text>
    <text x="328" y="60" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">18 Units <tspan fill="#38bdf8" font-size="12" font-weight="600">Multi-Team</tspan></text>

    <rect x="620" y="0" width="280" height="85" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="638" y="28" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">CROSS-TEAM SLA RATE</text>
    <text x="638" y="60" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">99.4% <tspan fill="#34d399" font-size="12" font-weight="600">Standardized</tspan></text>
  </g>

