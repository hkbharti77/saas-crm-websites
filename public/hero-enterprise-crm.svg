      <rect x="285" y="0" width="275" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="299" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">👥 Support: Tier-3 Dedicated Pod</text>

      <rect x="580" y="0" width="270" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="594" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔒 Access: Multi-Department RBAC</text>
